<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1a14" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="canonical" href="https://strosek.github.io/ultradiandrift/" />

    <title>UltradianDrift — Focus in Sync with Your Natural Rhythm</title>
    <meta
      name="description"
      content="UltradianDrift is a free, browser-only task tracker that syncs your tasks and focus sessions with your body's natural rhythm — Flowtime for deep work, Pomodoro for structure. No account, no ads, no subscription. Your data stays in your browser."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UltradianDrift" />
    <meta property="og:title" content="UltradianDrift — Focus in Sync with Your Natural Rhythm" />
    <meta
      property="og:description"
      content="Free, private, browser-only. Flowtime for deep work, Pomodoro for structure — aligned to your natural rhythm."
    />
    <meta property="og:url" content="https://strosek.github.io/ultradiandrift/" />
    <meta property="og:image" content="https://strosek.github.io/ultradiandrift/icon-512.png" />
    <meta property="og:image:alt" content="UltradianDrift — a green UD monogram above flowing ripples" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="UltradianDrift — Focus in Sync with Your Natural Rhythm" />
    <meta
      name="twitter:description"
      content="Free, private task tracker and focus timer that works with your body's natural rhythm."
    />
    <meta name="twitter:image" content="https://strosek.github.io/ultradiandrift/icon-512.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "UltradianDrift",
        "url": "https://strosek.github.io/ultradiandrift/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "description": "Free, browser-only task tracker and focus timer that syncs your work with your body's natural ultradian rhythm. Flowtime for deep, open-ended focus; Pomodoro for structure. Recurring routines, tags, and session history — all stored locally, no account or server required.",
        "featureList": [
          "Flowtime focus aligned to your natural rhythm",
          "Pomodoro timer for structured sessions",
          "Urgent/important task board",
          "Recurring routines (daily, work days, weekly, monthly)",
          "Session history and focus dashboard",
          "100% free, offline, and local"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "UltradianDrift"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>UltradianDrift — Work in sync with your natural rhythm</h1>
        <p>
          UltradianDrift is a free, browser-only task tracker for the way your energy actually moves. It
          syncs your tasks and focus sessions with your body's natural ~90-minute ultradian waves
          of focus, using <strong>Flowtime</strong> for deep, open-ended work and
          <strong>Pomodoro</strong> when you need structure.
        </p>
        <h2>Features</h2>
        <ul>
          <li>Flowtime focus that follows your natural rhythm</li>
          <li>Pomodoro timer with configurable work/break cycles</li>
          <li>Urgent/important task board with priorities 1–5</li>
          <li>Recurring routines: daily, work days, weekly, or monthly</li>
          <li>Tags, quick tasks, and natural-language quick-add</li>
          <li>Session history, dashboard charts, and focus streak</li>
          <li>100% free, private, offline, and local — no account, no ads</li>
        </ul>
        <p>This app requires JavaScript. Enable it to start focusing.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
